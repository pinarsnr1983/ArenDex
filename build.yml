name: Build Exe
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npx expo export
      - run: npm install electron electron-builder --save-dev
      - run: npx electron-builder --win

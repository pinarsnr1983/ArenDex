name: Build Exe

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Kodları İndir
      uses: actions/checkout@v3

    - name: Node.js Kurulumu
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Bağımlılıkları Yükle
      run: npm install

    - name: Metro Engellemek İçin Main'i Geçici Kaldır
      run: node -e "const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); delete p.main; fs.writeFileSync('package.json', JSON.stringify(p, null, 2));"

    - name: Expo Web Çıktısı Al
      run: npx expo export --clear

    - name: Main.js Kopyala ve package.json Düzelt
      run: |
        copy electron\main.js main.js
        node -e "const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); p.main = 'main.js'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2));"

    - name: Exe Dosyasını Derle
      run: npx electron-builder --win --publish never

    - name: Exe Dosyasını Kaydet (Artifacts)
      uses: actions/upload-artifact@v3
      with:
        name: ArenDex-Setup
        path: release/*.exe
